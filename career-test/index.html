:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}

.tag{position:absolute;border:3px solid var(--line);border-radius:14px;background:#fff;padding:6px 12px;
  font-family:'Black Han Sans';box-shadow:var(--shadow);}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
.floaty{animation:floaty 3.2s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:translateY(20px) scale(.96)}100%{opacity:1;transform:none}}
.r{animation:pop .55s cubic-bezier(.2,.9,.25,1) both}
@media (prefers-reduced-motion: reduce){.r,.floaty,.wob,.spin{animation:none!important;opacity:1!important}}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

@keyframes spin{to{transform:rotate(360deg)}}

.swap{transition:opacity .25s, transform .25s}

<script>

고하여 큰 결론을 세우는 당신. 독립적으로 장기 프로젝트를 설계하고 끈질기게 밀어붙이며, 직관적 통찰과 치밀한 논리를 함께 활용합니다.", "keywords": ["비전", "사고력", "계획", "도전", "독립"], "strengths": [["패턴 발견가", "흩어진 사실들 사이에서 '큰 패턴'을 찾아냅니다. 다윈이 수많은 생물을 관찰해 진화론을 세운 것처럼요."], ["장기 프로젝트의 강자", "몇 달, 몇 년이 걸리는 일도 묵묵히 끝까지 갑니다. 끈기와 설계력이 동시에 있어요."], ["통찰 + 논리", "번뜩이는 직관을 그냥 두지 않고 치밀한 근거로 다듬어 단단한 결론으로 만듭니다."]], "style": [["가설에서 출발", "흩어진 사실들 사이의 큰 패턴을 발견할 때 가설이 떠오릅니다."], ["축적과 정교화", "오랜 시간 자료를 모으고 정교한 결론으로 다듬어요."], ["깊은 협업", "소수와 깊이 있게 협업하며 핵심 전략을 설계합니다."]], "subjects": "생명과학·연구·공학·전략기획, 환경과학, 데이터 분석", "activities": "장기 관찰·연구 프로젝트, 탐구 일지 작성, 과학 논문 읽기, 전략 시뮬레이션", "quote": "\"살아남는 종은 강한 종이 아니라 변화에 가장 잘 적응하는 종이다.\"", "img": "images/INTJ_다윈.png"}, "ESFP": {"person": "폰 노이만", "title": "현장에서 빛나는 실전형 브레인", "emoji": "🎲", "theme": "#f97316", "catch": "\"일단 해보면 답이 나와!\"", "intro": "현장에서 직접 부딪히며 빠르게 배우는 실전형인 당신. 다재다능하고 다양한 분야에 두루 흥미를 보이며, 분위기를 밝게 만드는 센스와 순발력을 지녔어요.", "keywords": ["실전", "순발력", "다재다능", "센스", "활력"], "strengths": [["현장의 천재", "책상보다 현장에서 더 빨리 배웁니다. 직접 만지고 부딪히며 순식간에 감을 잡아요."], ["다재다능", "한 분야에 갇히지 않고 여러 영역을 넘나듭니다. 폰 노이만이 수학·물리·컴퓨터를 넘나든 것처럼요."], ["분위기 메이커", "어딜 가나 활기를 불어넣습니다. 무거운 팀 분위기를 단숨에 살리는 에너지가 있어요."]], "style": [["일단 실행", "'일단 해보자'는 실전 감각에서 탐구가 시작됩니다."], ["즉각 피드백", "직접 만지고 실험하며 바로바로 배워나가요."], ["팀에 활력", "활기찬 에너지로 분위기를 띄우고 실행을 가속합니다."]], "subjects": "응용수학·공학·체육·실용예술, 컴퓨터, 현장 실무 분야", "activities": "실험·실습 동아리, 현장 체험 프로젝트, 발표·공연, 다양한 분야 도전", "quote": "\"수학을 이해하는 게 아니라, 그저 익숙해지는 것이다.\"", "img": "images/ESFP_폰 노이만.png"}, "ISFP": {"person": "제인 구달", "title": "조용히 행동하는 감성형 탐구자", "emoji": "🌿", "theme": "#10b981", "catch": "\"말보다 행동으로 보여줄게.\"", "intro": "조용히 행동으로 보여주는 따뜻한 실천가인 당신. 섬세한 감각과 예술적 감성을 지녔고, 관심 대상을 오래도록 애정 어린 시선으로 관찰합니다.", "keywords": ["감성", "겸손", "관찰", "예술성", "개성"], "strengths": [["애정 어린 관찰", "구달이 침팬지를 오래 지켜보며 새로운 사실을 발견했듯, 당신도 대상을 깊이 지켜보며 남들이 못 본 걸 찾아내요."], ["섬세한 감각", "작은 차이와 분위기를 예민하게 알아챕니다. 예술적 감성이 탐구에도 묻어나요."], ["조용한 실천력", "떠들지 않고 행동으로 증명합니다. 진심 어린 행동이 곧 신뢰가 돼요."]], "style": [["경험에서 출발", "직접 보고 느낀 생생한 경험이 탐구의 씨앗이 됩니다."], ["깊은 현장 몰입", "대상에 깊이 몰입하며 세밀하게 기록해요."], ["행동으로 신뢰", "말보다 진심 어린 행동으로 신뢰를 쌓습니다."]], "subjects": "생명과학·예술·디자인·환경, 동물행동학, 시각예술", "activities": "자연·생태 관찰 프로젝트, 사진·미술 활동, 환경 동아리, 관찰 일지", "quote": "\"우리가 하는 모든 행동은 차이를 만든다. 어떤 차이를 만들지는 우리가 정한다.\"", "img": "images/ISFP_제인 구달.png"}, "ESFJ": {"person": "멘델", "title": "꾸준히 기록하는 관찰 탐구자", "emoji": "🌱", "theme": "#84cc16", "catch": "\"차곡차곡 모으면 규칙이 보여.\"", "intro": "성실하고 꼼꼼하게 자료를 모으고 정리하는 당신. 주변을 배려하며 협력적인 분위기를 만들고, 약속과 책임을 소중히 여기는 신뢰형이에요.", "keywords": ["성실", "배려", "협조", "꼼꼼함", "책임"], "strengths": [["데이터 수집왕", "멘델이 완두콩을 수년간 기르며 유전 법칙을 발견했듯, 당신은 꾸준한 기록 속에서 규칙을 찾아냅니다."], ["배려의 협업가", "팀원을 챙기고 분위기를 살피며 모두가 편하게 일하도록 돕습니다."], ["약속을 지키는 사람", "맡은 건 끝까지 해냅니다. 그래서 친구들이 가장 믿고 의지하는 타입이에요."]], "style": [["규칙 발견", "꾸준히 모은 데이터 속에서 의미 있는 규칙을 발견합니다."], ["성실한 반복", "정해진 절차를 성실히 반복하며 정확한 기록을 남겨요."], ["매끄러운 협업", "팀원을 챙기며 협업을 부드럽게 만듭니다."]], "subjects": "생명과학·간호·교육·통계, 보건, 사회과학", "activities": "장기 관찰·기록 프로젝트, 데이터 정리 활동, 팀 프로젝트 서포터, 봉사 동아리", "quote": "\"나의 시대는 반드시 올 것이다.\"", "img": "images/ESFJ_멘델.png"}, "ISFJ": {"person": "장영실", "title": "손으로 증명하는 실용 탐구자", "emoji": "⚙️", "theme": "#14b8a6", "catch": "\"실제로 쓸모 있어야 진짜지.\"", "intro": "묵묵히 손으로 만들고 다듬는 실용적 탐구자인 당신. 주어진 일을 책임감 있게 끝까지 해내고, 화려함보다 실제로 쓸모 있는 결과를 추구합니다.", "keywords": ["실용", "책임감", "성실", "관찰력", "끈기"], "strengths": [["손끝의 장인", "장영실이 측우기·해시계를 만들었듯, 당신은 머릿속 아이디어를 실제로 작동하는 결과물로 만들어냅니다."], ["책임감의 끝판왕", "한번 맡으면 끝까지 갑니다. '저 친구한테 맡기면 안심'이라는 평을 듣는 타입이에요."], ["세심한 관찰", "주변을 꼼꼼히 살펴 실제로 필요한 게 뭔지 정확히 짚어냅니다."]], "style": [["실용에서 출발", "'실제로 도움이 되는가'라는 질문에서 출발합니다."], ["손으로 해결", "구체적 문제를 직접 만들고 다듬으며 완성도를 높여요."], ["든든한 버팀목", "조용히 자기 몫을 다하며 팀의 기둥이 됩니다."]], "subjects": "기계·전자·건축·발명, 공예, 응용공학", "activities": "메이커·발명 동아리, 모형·기기 제작, 실용 프로젝트, 기술 자격 도전", "quote": "\"정밀함은 손끝에서 완성된다.\"", "img": "images/ISFJ_장영실.png"}, "ESTP": {"person": "에디슨", "title": "끝없이 시도하는 발명 탐구자", "emoji": "🔋", "theme": "#eab308", "catch": "\"안 되면? 다시 해보면 되지!\"", "intro": "현실의 문제를 끝없는 시도로 돌파하는 발명가형인 당신. 상황 변화에 빠르게 적응하고 과감하게 판단하며, 이론보다 실험과 경험으로 답을 찾습니다.", "keywor  q.opts.forEach((o,i)=>{

   b.onmouseenter=()=>{b.style.background='var(--accent)';b.style.color='#fff';};
   b.onmouseleave=()=>{b.style.background='#fff';b.style.color='var(--ink)';};
   b.onclick=()=>{
     answers.push(o.s);

}

   <div class="card r" style="padding:20px;animation-delay:.54s">
     <p class="gaegu" style="font-size:1.15rem;margin-bottom:8px">📚 관심 가져볼 분야</p>
     <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">${subj}</div>
     <p class="gaegu" style="font-size:1.15rem;margin-bottom:8px">🚀 추천 탐구 활동</p>
     <div style="display:flex;flex-wrap:wrap;gap:8px">${acts}</div>
   </div>

   <div class="r" style="margin-top:18px;background:var(--ink);color:var(--paper);border:3px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;animation-delay:.58s">
     <p class="gaegu" style="opacity:.8;margin-bottom:6px">💬 ${r.person}의 한마디</p>
     <p class="han" style="font-size:1.25rem;line-height:1.4">${r.quote}</p>
   </div>

   <div class="r" style="display:flex;gap:10px;margin-top:22px;animation-delay:.62s">
     <button id="retry" class="btn han" style="flex:1;padding:15px;font-size:1.05rem">다시하기</button>
     <button id="save" class="btn han" style="flex:1;padding:15px;font-size:1.05rem;background:var(--accent2)">이미지 저장</button>
     <button id="share" class="btn han" style="flex:1;padding:15px;font-size:1.05rem;background:${c};color:${onAcc}">공유</button>
   </div>
   <p class="gaegu" style="text-align:center;opacity:.5;margin-top:18px">© School Impact Lab · 탐구유형 테스트</p>
 </div>`);

 n.querySelector('#retry').onclick=landing;

 // SAVE as PNG
 n.querySelector('#save').onclick=async()=>{
   const cap=n.querySelector('#cap');
   try{
     const canvas=await html2canvas(cap,{scale:2,backgroundColor:null,useCORS:true});
     const a=document.createElement('a');
     a.download=`탐구유형_${r.person}형.png`;
     a.href=canvas.toDataURL('image/png'); a.click();
   }catch(e){ alert('이미지 저장은 인터넷 연결 환경에서 동작해요.'); }
 };

 // SHARE: native -> clipboard
 n.querySelector('#share').onclick=async()=>{
   const txt=`나의 탐구 유형은 「${r.person}형 - ${r.title}」(${type})!\n${r.catch}\n#스쿨임팩트랩 #탐구유형테스트`;
   const data={title:'나의 탐구 유형 테스트',text:txt,url:location.href};
   if(navigator.share && (!navigator.canShare || navigator.canShare(data))){
     try{ await navigator.share(data); return; }catch(e){ if(e.name==='AbortError') return; }
   }
   try{ await navigator.clipboard.writeText(txt); toast('결과 문구를 복사했어요! 친구에게 붙여넣기 하세요 📋'); }
   catch(e){ alert(txt); }
 };

 show(n);
}

function toast(msg){
 const t=h(`<div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10000;
   background:var(--ink);color:var(--paper);border:3px solid var(--line);border-radius:14px;
   padding:12px 18px;font-family:'Jua';box-shadow:var(--shadow);max-width:90%;text-align:center">${msg}</div>`);
 document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

landing();
</script>
</body>
</html>
