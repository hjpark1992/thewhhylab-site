; ============================================================
; 더와이랩 폼 백엔드 — PHP 런타임 설정 (api/ 디렉토리 한정)
; 파일 업로드 최대 10MB(config.php의 max_upload_bytes)에 맞춘 여유 한도.
;
; ⚠️ 이 .user.ini 는 PHP가 CGI/FastCGI 로 동작할 때만 적용됩니다.
;    Apache 모듈(mod_php) 환경에서는 무시되므로, 그 경우
;    Cafe24 [나의서비스관리 > 웹호스팅 > PHP 설정 / php.ini] 에서
;    아래 값들을 직접 상향하세요.
; ============================================================

; 업로드 1건 최대 크기 (앱은 10MB로 재검증 → 12M 여유)
upload_max_filesize = 12M
; POST 본문 전체 한도 (파일 + 텍스트 필드 합) — upload_max_filesize 보다 커야 함
post_max_size = 13M
; 동시 업로드 파일 수
max_file_uploads = 5
; 처리 여유
memory_limit = 128M
max_execution_time = 60
