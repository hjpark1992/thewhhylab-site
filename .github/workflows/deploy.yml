# main 브랜치에 병합되면 바뀐 파일만 cafe24 FTP로 올린다.
# 비밀값은 GitHub → Settings → Secrets and variables → Actions 에 넣는다:
#   FTP_SERVER   예) ftp.thewhhylab.com 또는 cafe24가 알려준 호스트
#   FTP_USERNAME cafe24 FTP 아이디
#   FTP_PASSWORD cafe24 FTP 비밀번호
# 2026-11-20 dry-run 확인 후 실배포 전환. 계획만 보려면 with: 에 dry-run: true 를 임시로 넣는다.

name: deploy-to-cafe24

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP 진단 (러너에서 보이는 디렉터리, 이름만)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          umask 077; printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.nrc"
          echo "== PWD / FEAT"; curl -sS --netrc-file "$HOME/.nrc" --ftp-pasv --max-time 40 -Q PWD -Q FEAT "ftp://$FTP_SERVER/" -o /dev/null -v 2>&1 | grep -E '^< (257|550|211|230)' | head -5
          echo "== login dir listing"; curl -sS --netrc-file "$HOME/.nrc" --ftp-pasv --max-time 40 -l "ftp://$FTP_SERVER/" | head -15
          echo "== root listing"; curl -sS --netrc-file "$HOME/.nrc" --ftp-pasv --max-time 40 -l "ftp://$FTP_SERVER//" | head -15
          rm -f "$HOME/.nrc"
        continue-on-error: true

      - name: FTP 배포
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          # 이 도구는 FTP 루트(/)로 이동한 뒤 상대 경로로 들어간다. cafe24 웹루트 = /www → www/
          server-dir: www/
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            AGENTS.md
            .claude/**
            _template/**
            AX_Discovery/assets/source/**
            .gitignore
            docs/**
            test/**
            db/**
            _data/**
            _private/**
            _Upload/**
            **/*.bak
            api/config.php
            api/config.sample.php
            api/uploads/**
            axd/**
            PathOn/**
            sil/**
