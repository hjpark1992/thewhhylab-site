# main 브랜치에 병합되면 바뀐 파일만 cafe24 FTP로 올린다.
# 비밀값은 GitHub → Settings → Secrets and variables → Actions 에 넣는다:
#   FTP_SERVER   예) ftp.thewhhylab.com 또는 cafe24가 알려준 호스트
#   FTP_USERNAME cafe24 FTP 아이디
#   FTP_PASSWORD cafe24 FTP 비밀번호
# 처음에는 dry-run: true 로 두고 Actions 탭에서 수동 실행해 계획만 본다.
# 계획이 맞으면 dry-run 줄을 지우고 커밋한다.

name: deploy-to-cafe24

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP 배포
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          # FTP 로그인 위치가 곧 웹루트다(기존 배포 스크립트 기준: ftp://thewhhylab.com/<경로>).
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            AGENTS.md
            .claude/**
            _template/**
            AX_Discovery/assets/source/**
            .gitignore
            docs/**
            test/**
            db/**
            _data/**
            _private/**
            _Upload/**
            **/*.bak
            api/config.php
            api/config.sample.php
            api/uploads/**
            axd/**
            PathOn/**
            sil/**
