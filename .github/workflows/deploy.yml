# main 브랜치에 병합되면 바뀐 파일만 cafe24 FTP로 올린다.
# 비밀값은 GitHub → Settings → Secrets and variables → Actions 에 넣는다:
#   FTP_SERVER   예) ftp.thewhhylab.com 또는 cafe24가 알려준 호스트
#   FTP_USERNAME cafe24 FTP 아이디
#   FTP_PASSWORD cafe24 FTP 비밀번호
# 2026-11-20 dry-run 확인 후 실배포 전환. 계획만 보려면 with: 에 dry-run: true 를 임시로 넣는다.

name: deploy-to-cafe24

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP 배포
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          # 이 도구는 FTP 루트 기준 절대 경로를 쓴다. cafe24 로그인 디렉터리(웹루트) = /www
          server-dir: /www/
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            AGENTS.md
            .claude/**
            _template/**
            AX_Discovery/assets/source/**
            .gitignore
            docs/**
            test/**
            db/**
            _data/**
            _private/**
            _Upload/**
            **/*.bak
            api/config.php
            api/config.sample.php
            api/uploads/**
            axd/**
            PathOn/**
            sil/**
