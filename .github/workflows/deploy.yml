# main 브랜치에 병합되면 바뀐 파일만 cafe24 FTP로 올린다.
# 비밀값은 GitHub → Settings → Secrets and variables → Actions 에 넣는다:
#   FTP_SERVER   예) ftp.thewhhylab.com 또는 cafe24가 알려준 호스트
#   FTP_USERNAME cafe24 FTP 아이디
#   FTP_PASSWORD cafe24 FTP 비밀번호
# 처음에는 dry-run: true 로 두고 Actions 탭에서 수동 실행해 계획만 본다.
# 계획이 맞으면 dry-run 줄을 지우고 커밋한다.

name: deploy-to-cafe24

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP 배포
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          # cafe24 FTP에 로그인했을 때 웹루트 폴더 이름. FileZilla 오른쪽 창에서 확인.
          server-dir: www/
          state-name: .ftp-deploy-sync-state.json
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .gitattributes
            .gitignore
            api/config.php
            api/config.sample.php
            api/uploads/**
            axd/**
            PathOn/**
            sil/**
